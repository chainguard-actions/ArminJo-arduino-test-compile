name: Test build-properties parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with build-properties for extra compiler flags
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'
          build-properties: '{ "All": "-DTEST_FLAG" }'

      - name: Assert compilation succeeded with build-properties
        run: |
          echo "Action completed successfully with build-properties"
          echo "PASS: build-properties parameter works correctly"
