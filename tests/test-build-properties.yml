name: Test build properties (extra compiler flags)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compile Blink sketch with extra build properties
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          build-properties: '{ "All": "-DDEBUG" }'
          cli-version: 'latest'

      - name: Assert compilation with build properties succeeded
        run: |
          echo "PASS: Compilation with build-properties completed without error"
