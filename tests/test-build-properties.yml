name: Test build-properties compiler flags
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run arduino-test-compile action with build-properties
        id: action
        uses: .
        with:
          sketch-names: 'WithDefine.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          build-properties: '{ "WithDefine": "-DMY_DEFINE=1" }'
          debug-compile: 'true'

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with build-properties"
          echo "PASS: build-properties correctly passed -DMY_DEFINE=1 to compiler"
