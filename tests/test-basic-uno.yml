name: Test basic compile for Arduino UNO
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          arduino-board-fqbn: 'arduino:avr:uno'
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'

      - name: Assert compilation succeeded
        run: |
          echo "Action completed successfully"
          echo "PASS: Blink sketch compiled for arduino:avr:uno"
