name: Test wildcard sketch-names pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with wildcard sketch-names to compile all .ino files
        id: action
        uses: .
        with:
          sketch-names: '*.ino'
          sketch-names-find-start: 'tests/fixtures/sketches/Blink'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'

      - name: Assert compilation succeeded
        run: |
          echo "Action completed successfully with wildcard sketch-names"
          echo "PASS: Wildcard sketch-names compilation succeeded"
