name: Test Arduino compile with sketches-exclude
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          sketch-names: '*.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          sketches-exclude: 'HelloSerial'
          cli-version: 'latest'

      - name: Assert compilation succeeded with exclusion
        run: |
          echo "Compilation with sketches-exclude=HelloSerial completed successfully"
          echo "PASS"
