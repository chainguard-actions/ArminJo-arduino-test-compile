name: Test sketches-exclude parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with sketches-exclude to skip BlinkFast
        id: action
        uses: .
        with:
          sketch-names: '*.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'
          sketches-exclude: 'BlinkFast'

      - name: Assert compilation succeeded (BlinkFast excluded, Blink compiled)
        run: |
          echo "Action completed successfully with sketches-exclude"
          echo "PASS: sketches-exclude parameter works correctly"
