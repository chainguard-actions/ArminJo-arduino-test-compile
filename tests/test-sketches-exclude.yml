name: Test sketches-exclude parameter
on:
  workflow_dispatch:

jobs:
  test-sketches-exclude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run arduino-test-compile action with sketches-exclude
        id: action
        uses: .
        with:
          sketch-names: '*.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'
          # Exclude Fade and ConditionalBlink, only compile Blink
          sketches-exclude: 'Fade,ConditionalBlink'

      - name: Assert compilation succeeded with exclusions
        run: |
          echo "PASS: Sketches compiled with Fade and ConditionalBlink excluded"
