name: Test sketches-exclude input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run arduino-test-compile action excluding HelloWorld sketch
        id: action
        uses: .
        with:
          sketch-names: '*.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          sketches-exclude: 'HelloWorld,WithDefine'

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with sketches-exclude"
          echo "PASS: sketches-exclude correctly skipped HelloWorld and WithDefine, compiled only Blink"
