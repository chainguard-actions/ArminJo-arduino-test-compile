name: Test debug compile mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compile sketch with debug flags enabled
        id: action
        uses: .
        with:
          arduino-board-fqbn: 'arduino:avr:uno'
          sketch-names: 'MinimalSketch.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          cli-version: 'latest'
          debug-compile: 'true'
          debug-install: 'true'

      - name: Assert debug compilation succeeded
        run: |
          echo "Debug compilation step completed successfully"
          echo "PASS: debug-compile and debug-install mode compilation succeeded"
