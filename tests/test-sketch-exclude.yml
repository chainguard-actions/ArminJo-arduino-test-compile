name: Test sketch exclusion
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture sketches to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Blink"
          cp "$GITHUB_WORKSPACE/tests/fixtures/sketches/Blink/Blink.ino" "$GITHUB_WORKSPACE/Blink/Blink.ino"
          mkdir -p "$GITHUB_WORKSPACE/Fade"
          cp "$GITHUB_WORKSPACE/tests/fixtures/sketches/Fade/Fade.ino" "$GITHUB_WORKSPACE/Fade/Fade.ino"

      - name: Compile sketches excluding Fade
        id: action
        uses: .
        with:
          sketch-names: '*.ino'
          arduino-board-fqbn: 'arduino:avr:uno'
          sketches-exclude: 'Fade'
          cli-version: 'latest'

      - name: Assert compilation succeeded with exclusion
        run: |
          echo "Compilation with sketch exclusion completed successfully"
          echo "PASS: Blink compiled, Fade excluded"
