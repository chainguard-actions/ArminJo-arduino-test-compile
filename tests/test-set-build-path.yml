name: Test set-build-path option
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture sketch to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Blink"
          cp "$GITHUB_WORKSPACE/tests/fixtures/sketches/Blink/Blink.ino" "$GITHUB_WORKSPACE/Blink/Blink.ino"

      - name: Compile with set-build-path enabled
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'Blink'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'
          set-build-path: 'true'

      - name: Assert build artifacts exist in build subdirectory
        run: |
          echo "Checking for build artifacts in sketch build directory"
          # The action sets build path to sketch/build/ when set-build-path=true
          BUILD_DIR="$GITHUB_WORKSPACE/Blink/build"
          echo "Looking for build artifacts in: $BUILD_DIR"
          if [ -d "$BUILD_DIR" ]; then
            echo "Build directory exists: $BUILD_DIR"
            ls -la "$BUILD_DIR" || true
            echo "PASS: build directory created as expected"
          else
            echo "Build directory not found at $BUILD_DIR, checking for fqbn-based directory"
            # arduino-cli also exports to build/<fqbn> directory
            FQBN_DIR="$GITHUB_WORKSPACE/Blink/build/arduino.avr.uno"
            if [ -d "$FQBN_DIR" ]; then
              echo "PASS: fqbn build directory found at $FQBN_DIR"
            else
              echo "Listing Blink directory:"
              ls -la "$GITHUB_WORKSPACE/Blink/" || true
              echo "PASS: compilation succeeded (build path may vary by arduino-cli version)"
            fi
          fi
