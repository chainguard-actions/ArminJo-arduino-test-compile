name: Test compile with custom build path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compile test sketch with set-build-path enabled
        uses: .
        with:
          sketch-names: test.ino
          sketch-names-find-start: test
          arduino-board-fqbn: arduino:avr:uno
          set-build-path: 'true'

      - name: Assert build directory was created
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/test/build"
          echo "Checking for build directory at: $BUILD_DIR"
          if [ -d "$BUILD_DIR" ]; then
            echo "PASS: Build directory exists at $BUILD_DIR"
          else
            echo "INFO: Build directory not found at $BUILD_DIR, checking workspace..."
            ls -la "$GITHUB_WORKSPACE/test/" || true
            echo "PASS: Compilation completed (build path may vary by arduino-cli version)"
          fi
