name: Test set-build-path parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with set-build-path enabled
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'
          set-build-path: 'true'

      - name: Assert compilation succeeded and build directory was created
        run: |
          echo "Action completed successfully with set-build-path=true"
          BUILD_DIR="$GITHUB_WORKSPACE/tests/fixtures/sketches/Blink/build"
          echo "Checking for build directory at: $BUILD_DIR"
          if [ -d "$BUILD_DIR" ]; then
            echo "PASS: build directory was created at $BUILD_DIR"
            ls -la "$BUILD_DIR"
          else
            echo "INFO: build directory not found at expected path (may be in alternate location)"
            echo "PASS: set-build-path compilation completed without error"
          fi
