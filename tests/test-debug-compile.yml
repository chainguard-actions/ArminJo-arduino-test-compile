name: Test debug-compile mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with debug-compile enabled
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'
          debug-compile: 'true'

      - name: Assert compilation succeeded in debug mode
        run: |
          echo "Action completed successfully with debug-compile=true"
          echo "PASS: debug-compile mode compilation succeeded"
