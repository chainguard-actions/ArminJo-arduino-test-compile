name: Test debug compile mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture sketch to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Blink"
          cp "$GITHUB_WORKSPACE/tests/fixtures/sketches/Blink/Blink.ino" "$GITHUB_WORKSPACE/Blink/Blink.ino"

      - name: Compile with debug-compile enabled
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'Blink'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'
          debug-compile: 'true'

      - name: Assert debug compilation succeeded
        run: |
          echo "Debug compilation step completed successfully"
          echo "PASS: arduino:avr:uno debug compilation succeeded"
