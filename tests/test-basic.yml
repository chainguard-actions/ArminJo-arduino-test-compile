name: Test basic Arduino sketch compilation
on:
  workflow_dispatch:

jobs:
  test-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run arduino-test-compile action on Blink sketch
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          cli-version: 'latest'

      - name: Assert compilation succeeded
        run: |
          echo "PASS: Blink sketch compiled successfully for arduino:avr:uno"
