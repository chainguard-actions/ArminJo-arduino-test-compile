name: Test build-properties with All key
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run arduino-test-compile action with All build-properties
        id: action
        uses: .
        with:
          sketch-names: 'Blink.ino,HelloWorld.ino'
          sketch-names-find-start: 'tests/fixtures/sketches'
          arduino-board-fqbn: 'arduino:avr:uno'
          build-properties: '{ "All": "-DTEST_FLAG=1" }'
          debug-compile: 'true'

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with All build-properties"
          echo "PASS: All build-properties correctly applied -DTEST_FLAG=1 to all sketches"
