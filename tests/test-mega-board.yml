name: Test compile for Arduino Mega board
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compile test sketch for Arduino Mega
        uses: .
        with:
          sketch-names: test.ino
          sketch-names-find-start: test
          arduino-board-fqbn: arduino:avr:mega

      - name: Assert compilation succeeded
        run: |
          echo "PASS: Arduino Mega compilation completed successfully"
